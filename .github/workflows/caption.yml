name: Caption channel videos

# One repo for every channel. Which channel a video belongs to comes from its HeyGen title,
# using channels.json. Videos whose title matches no channel are skipped - never guessed.
#
# Runs three ways:
#  1. Instantly: the Cloudflare relay starts it when HeyGen finishes a video (repository_dispatch)
#  2. By hand: Actions tab -> "Caption channel videos" -> Run workflow (paste a video ID)
#  3. Once a day as a safety net: catches any channel video the relay missed
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      video_id:
        description: "HeyGen video ID (leave empty to process all new channel videos)"
        required: false
        default: ""
      dry_run:
        description: "Only list which videos would be captioned (captions and publishes nothing)"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [heygen_video]

permissions:
  contents: write

concurrency:
  group: caption-${{ github.event.client_payload.video_id || github.event.inputs.video_id || 'sweep' }}
  cancel-in-progress: false

jobs:
  caption:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg, Pillow + OpenCV (face check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow "opencv-python-headless<5"

      - name: Work out which videos to caption
        run: |
          ID="${{ github.event.inputs.video_id }}"
          if [ -z "$ID" ]; then ID="${{ github.event.client_payload.video_id }}"; fi
          if [ -n "$ID" ]; then
            echo "$ID" > ids.txt
          else
            ARGS=()
            while read -r P; do ARGS+=(--prefix "$P"); done < <(python captions/channels.py prefixes)
            python captions/heygen.py list-new "${ARGS[@]}" --hours 48 > ids.txt
          fi
          echo "Candidates:"; cat ids.txt || true
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run - nothing captioned."; : > ids.txt
          fi

      - name: Caption and publish
        run: |
          REPO="${{ github.repository }}"
          FAILED=""
          # Read IDs on fd 3 so ffmpeg (or anything else) can't swallow the list from stdin
          while read -r ID <&3; do
            ID="${ID//[[:space:]]/}"
            [ -z "$ID" ] && continue
            echo "=== $ID"
            if ! [[ "$ID" =~ ^[0-9a-f]{32}$ ]]; then
              echo "::warning::'$ID' is not a valid HeyGen video ID - skipped."
              continue
            fi
            rm -rf work && mkdir work
            if ! python captions/heygen.py fetch "$ID" --out work; then
              echo "::error::Could not fetch $ID from HeyGen - skipped, continuing with the rest."
              FAILED="$FAILED $ID"
              continue
            fi
            TITLE=$(python -c "import json;print(json.load(open('work/meta.json')).get('title') or '')")
            if ! MATCH=$(python captions/channels.py match "$TITLE"); then
              echo "No channel matches title '$TITLE' - skipped (nothing published)."
              continue
            fi
            IFS=, read -r SLUG CAP_Y BRAND CHANNEL <<< "$MATCH"
            echo "Channel: $CHANNEL ($SLUG), Metricool brand $BRAND"
            # Optional per-video red/green phrases: highlights/<slug>-<id>.json (no file = default colouring).
            # Highlighted versions get their own "-color" release, so a plain release is never overwritten.
            HL_ARGS=()
            SUFFIX=""
            if [ -f "highlights/$SLUG-$ID.json" ]; then HL_ARGS=(--highlights "highlights/$SLUG-$ID.json"); SUFFIX=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('suffix','-color'))" "highlights/$SLUG-$ID.json"); echo "Using highlights/$SLUG-$ID.json"; fi
            TAG="$SLUG-$ID$SUFFIX"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Already done: $TAG"; continue
            fi
            if [ ! -f work/captions.srt ]; then
              echo "::warning::No caption file from HeyGen for $ID - skipped."
              continue
            fi
            OUT="$SLUG-$ID$SUFFIX.mp4"
            if ! python captions/burn.py --video work/video.mp4 --srt work/captions.srt --out "$OUT" --y "$CAP_Y" "${HL_ARGS[@]}" < /dev/null; then
              echo "::error::Captioning failed for $ID - skipped, continuing with the rest."
              FAILED="$FAILED $ID"
              continue
            fi
            gh release create "$TAG" "$OUT" --title "$TITLE" \
              --notes "Channel: $CHANNEL | Metricool brand: $BRAND | HeyGen video: $ID"
            URL="https://github.com/$REPO/releases/download/$TAG/$OUT"
            echo "Captioned video: $URL"
            echo "- **$CHANNEL** (brand $BRAND): [$TITLE]($URL)" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$NOTIFY_WEBHOOK" ]; then
              ID="$ID" TITLE="$TITLE" URL="$URL" CHANNEL="$CHANNEL" BRAND="$BRAND" python -c "import json,os,urllib.request as u; d=json.dumps({k.lower():os.environ[k] for k in ('ID','TITLE','URL','CHANNEL','BRAND')}).encode(); u.urlopen(u.Request(os.environ['NOTIFY_WEBHOOK'],data=d,headers={'Content-Type':'application/json'}),timeout=30)" \
                || echo "::warning::notify webhook failed"
            fi
          done 3< ids.txt
          if [ -n "$FAILED" ]; then
            echo "::error::These videos were not captioned:$FAILED (re-run this job, or run it by hand with the video ID)"
            exit 1
          fi
